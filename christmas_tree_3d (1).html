<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Merry Christmas | 3D Particle Tree</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020511}
canvas{display:block;width:100%;height:100%}
.ui{position:fixed;inset:0;pointer-events:none;color:#f4f6ff;font-family:Georgia,serif;text-align:center}
h1{margin:5vh 0 0;font-size:clamp(28px,5vw,56px);font-weight:400;font-style:italic;letter-spacing:.04em;text-shadow:0 0 18px #80cfff,0 0 38px #527dff}
.sub{font:12px system-ui;letter-spacing:.28em;color:#bcd9ff;margin-top:12px}
.controls{position:fixed;right:18px;top:18px;display:flex;gap:8px;pointer-events:auto}
button{background:#101d39bb;color:#eaf5ff;border:1px solid #9dcaff66;border-radius:30px;padding:9px 14px;cursor:pointer}
.hint{position:fixed;bottom:18px;width:100%;font:11px system-ui;letter-spacing:.18em;color:#a9c8e9aa}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui"><h1>Merry Christmas</h1><div class="sub">✦ WISHING YOU A MAGICAL SEASON ✦</div></div>
<div class="controls"><button id="pause">Pause</button><button id="snow">Snow: On</button></div>
<div class="hint">MOVE YOUR MOUSE TO CHANGE THE VIEW</div>
<script>
(()=>{
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let w,h,dpr,paused=false,snowOn=true,angle=0,last=0,mx=0,my=0,tx=0,ty=0;
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a);
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
addEventListener('pointermove',e=>{tx=(e.clientX/w-.5)*.25;ty=(e.clientY/h-.5)*.14});
const stars=Array.from({length:260},()=>({x:Math.random(),y:Math.random()*.85,r:rand(.5,1.8),p:rand(0,TAU)}));
const flakes=Array.from({length:100},()=>({x:Math.random(),y:Math.random(),r:rand(1,3.3),v:rand(.025,.09),p:rand(0,TAU)}));
const pts=[];
function put(x,y,z,col,r=1.3,glow=0){pts.push({x,y,z,col,r,glow})}
// Fuzzy tree body
for(let i=0;i<14500;i++){
 let u=Math.random(),v=Math.pow(u,1.55),y=10.5*v+.1;
 let branch=Math.max(0,Math.sin((v*5.8+.15)*TAU));
 let rad=Math.pow(1-v,1.08)*2.8*(1+.5*branch),a=rand(0,TAU),rr=rad*Math.sqrt(Math.random());
 let gold=Math.random()<.08;
 put(Math.cos(a)*rr,y,Math.sin(a)*rr,gold?'#fff0bd':`rgb(70,${(150+Math.random()*90)|0},${(175+Math.random()*75)|0})`,gold?2:rand(.7,1.5),gold?8:2);
}
// Spiral garland lights
for(let i=0;i<1800;i++){
 let u=i/1800,v=Math.pow(u,1.6),y=10.6*v+.2;
 let branch=Math.max(0,Math.sin((v*5.8+.15)*TAU));
 let rad=Math.pow(1-v,1.08)*2.95*(1+.5*branch),a=u*9*TAU;
 put(Math.cos(a)*rad,y,Math.sin(a)*rad,i%6===0?'#fff4c7':i%2?'#a9f6ff':'#f9d9ff',rand(1.5,2.5),10);
}
// Bright outer sparkle fill
for(let i=0;i<3500;i++){
 let v=Math.pow(Math.random(),1.8),y=10.4*v+.1;
 let rad=Math.pow(1-v,1.1)*3.4*Math.sqrt(Math.random()),a=rand(0,TAU);
 put(Math.cos(a)*rad,y,Math.sin(a)*rad,`rgb(100,${(170+Math.random()*70)|0},255)`,rand(.7,1.3),1);
}
// Heart topper particles
for(let i=0;i<700;i++){
 let x,y,n=0;
 do{x=rand(-1.2,1.2);y=rand(-1.2,1.2);n++}while((x*x+y*y-1)**3-x*x*y**3>0&&n<100);
 put(x*.68,10.95+(y+1)*.35,rand(-.1,.1),i%5?'#ff91c8':'#fff0d1',rand(1,2.1),8);
}
// Ground magic rings
const floor=[];
for(let i=0;i<2100;i++){let a=rand(0,TAU),r=rand(3.2,7.4);floor.push({x:Math.cos(a)*r,y:-.12,z:Math.sin(a)*r,col:Math.random()<.3?'#fff':'#9dcfff',r:rand(.6,1.4)})}
function project(p,rot,pitch,scale){
 let ca=Math.cos(rot),sa=Math.sin(rot),x=p.x*ca-p.z*sa,z=p.x*sa+p.z*ca;
 let cp=Math.cos(pitch),sp=Math.sin(pitch),yy=p.y*cp-z*sp-4.7,zz=p.y*sp+z*cp+13;
 if(zz<.1)return null;let f=scale/zz;
 return {x:w/2+x*f,y:h*.59-yy*f,depth:zz};
}
function drawSet(list,rot,pitch,scale){
 const visible=[];
 for(const p of list){let q=project(p,rot,pitch,scale);if(q&&q.x>-10&&q.x<w+10&&q.y>-10&&q.y<h+10)visible.push({p,q})}
 visible.sort((a,b)=>b.q.depth-a.q.depth);
 for(const {p,q} of visible){
  let r=Math.max(.45,p.r*(1.5-q.depth*.035));
  ctx.globalAlpha=Math.max(.25,Math.min(1,1.25-q.depth*.03));
  if(p.glow){ctx.shadowBlur=p.glow;ctx.shadowColor=p.col}
  ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(q.x,q.y,r,0,TAU);ctx.fill();ctx.shadowBlur=0;
 }
 ctx.globalAlpha=1;
}
function draw(now,dt){
 let g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#020411');g.addColorStop(.6,'#08152d');g.addColorStop(1,'#02040c');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
 let neb=ctx.createRadialGradient(w*.5,h*.52,0,w*.5,h*.52,Math.min(w,h)*.58);neb.addColorStop(0,'#294b7840');neb.addColorStop(.6,'#38245b18');neb.addColorStop(1,'transparent');ctx.fillStyle=neb;ctx.fillRect(0,0,w,h);
 for(const s of stars){let tw=.35+.65*(.5+.5*Math.sin(now*.001+s.p));ctx.globalAlpha=tw;ctx.fillStyle='#d9ecff';ctx.beginPath();ctx.arc(s.x*w,s.y*h,s.r*tw,0,TAU);ctx.fill()}
 ctx.globalAlpha=1;
 const scale=Math.min(w,h)*.78,pitch=-.19+my;
 drawSet(floor,angle*.6,pitch,scale);drawSet(pts,angle+mx,pitch,scale);
 if(snowOn){for(const f of flakes){f.y+=f.v*dt;f.x+=Math.sin(now*.0007+f.p)*.000025*dt;if(f.y>1.03){f.y=-.04;f.x=Math.random()}ctx.globalAlpha=.45+.4*Math.sin(now*.001+f.p);ctx.fillStyle='#fff';ctx.shadowBlur=10;ctx.shadowColor='#b8e4ff';ctx.beginPath();ctx.arc(f.x*w,f.y*h,f.r,0,TAU);ctx.fill()}ctx.globalAlpha=1;ctx.shadowBlur=0}
 // small luminous ground base
 ctx.globalAlpha=.45;ctx.strokeStyle='#8edfff';ctx.shadowBlur=18;ctx.shadowColor='#65bfff';
 ctx.beginPath();ctx.ellipse(w/2,h*.86,Math.min(w,h)*.23,Math.min(w,h)*.035,0,0,TAU);ctx.stroke();ctx.shadowBlur=0;ctx.globalAlpha=1;
}
function loop(now){let dt=last?Math.min((now-last)/1000,.04):0;last=now;if(!paused){angle+=dt*.32;mx+=(tx-mx)*.035;my+=(ty-my)*.035}draw(now,dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause'};
document.getElementById('snow').onclick=e=>{snowOn=!snowOn;e.target.textContent='Snow: '+(snowOn?'On':'Off')};
})();
</script>
</body>
</html>
